<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps Pipeline Demo</title>

<!-- Optional icons (Font Awesome CDN) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e3f2fd, #fce4ec);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        text-align: center;
        background: white;
        padding: 40px 60px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        font-size: 2.5rem;
        color: #1976d2;
        animation: glow 1.5s infinite alternate;
    }

    p {
        font-size: 1.5rem;
        margin-top: 20px;
        color: #333;
        animation: blink 1.2s infinite;
    }

    .icons {
        margin-top: 25px;
        font-size: 2rem;
        color: #ff4081;
    }

    .icons i {
        margin: 0 10px;
        animation: float 2s infinite ease-in-out;
    }

    /* Glow animation */
    @keyframes glow {
        from {
            text-shadow: 0 0 5px #42a5f5, 0 0 10px #42a5f5;
        }
        to {
            text-shadow: 0 0 15px #1e88e5, 0 0 25px #1e88e5;
        }
    }

    /* Blinking animation */
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    /* Floating icons */
    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="container">
    <h1><i class="fas fa-cogs"></i> DevOps Pipeline Demo</h1>
    <p>🚀 Build Number: <strong>VERSION</strong></p>

    <div class="icons">
        <i class="fas fa-code"></i>
        <i class="fas fa-sync-alt"></i>
        <i class="fas fa-cloud-upload-alt"></i>
        <i class="fas fa-check-circle"></i>
    </div>
</div>

</body>
</html>
